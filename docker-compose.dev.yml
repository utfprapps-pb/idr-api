services:
  idr-db:
    container_name: idr-db
    image: postgres
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      PGDATA: /data/postgres
    volumes:
      - idr-db:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - idr-db
    restart: unless-stopped

  idr-api:
    container_name: idr-api
    image: maven:3.8.3-openjdk-17
    working_dir: /home/java/app
    restart: always
    command: mvn spring-boot:run -Dspring-boot.run.jvmArguments="-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    volumes:
      - ./:/home/java/app
    ports:
      - "8080:8080"
      - "5005:5005"
    networks:
      - idr-db
    depends_on:
      - idr-db
      - minio

  minio:
    container_name: minio
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - idr-minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - idr-db
    restart: unless-stopped

networks:
  idr-db:
    driver: bridge

volumes:
  idr-db:
  idr-minio: