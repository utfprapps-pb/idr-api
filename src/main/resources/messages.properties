# Textos em português dos erros padrão do Spring MVC no formato Problem Details (RFC 9457).
# O ResponseEntityExceptionHandler resolve "problemDetail.<classe>" (detail) e "problemDetail.title.<classe>" (title).
# Argumentos conferidos no Spring Framework 7.0.7. Com argumentos, apóstrofo literal é escrito '' (MessageFormat).
# Sem sufixo de idioma: vale para qualquer Accept-Language.

# 400 — o type/title passam a ser os de "validacao" (GlobalExceptionHandler.handleExceptionInternal)
# {0} nome do parâmetro, {1} valor recebido, {2} tipo esperado
problemDetail.org.springframework.beans.TypeMismatchException=Valor inválido para o parâmetro ''{0}'': ''{1}''
# {0} nome do parâmetro
problemDetail.org.springframework.web.bind.MissingServletRequestParameterException=Parâmetro obrigatório ''{0}'' ausente
# {0} erros de validação
problemDetail.org.springframework.web.method.annotation.HandlerMethodValidationException=Erro de validação

# 404
# {0} caminho do recurso
problemDetail.org.springframework.web.servlet.resource.NoResourceFoundException=Recurso não encontrado
problemDetail.title.org.springframework.web.servlet.resource.NoResourceFoundException=Rota não encontrada

# 405 — {0} método recebido, {1} métodos suportados
problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException=Método {0} não suportado
problemDetail.title.org.springframework.web.HttpRequestMethodNotSupportedException=Método não permitido

# 406 — {0} formatos aceitos
problemDetail.org.springframework.web.HttpMediaTypeNotAcceptableException=Formato de resposta não suportado
problemDetail.title.org.springframework.web.HttpMediaTypeNotAcceptableException=Formato de resposta não suportado

# 413
problemDetail.org.springframework.web.multipart.MaxUploadSizeExceededException=Arquivo acima do tamanho máximo permitido
problemDetail.title.org.springframework.web.multipart.MaxUploadSizeExceededException=Arquivo muito grande

# 415 — {0} Content-Type recebido, {1} tipos suportados
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=Tipo de conteúdo {0} não suportado
problemDetail.title.org.springframework.web.HttpMediaTypeNotSupportedException=Tipo de conteúdo não suportado

# 500 — erro de configuração do servidor; {0} nome da variável
problemDetail.org.springframework.web.bind.MissingPathVariableException=Variável de caminho ''{0}'' ausente
problemDetail.title.org.springframework.web.bind.MissingPathVariableException=Erro interno
