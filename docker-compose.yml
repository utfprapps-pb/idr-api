version: "3.9"

########################### SERVICES
services:
  ########################### DAINF LABS API
  idr-api:
    image: idr-api
    container_name: idr-api
    build:
      context: ./
      dockerfile: Dockerfile
    environment:
      - SERVER_PORT=${SERVER_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - TZ=America/Sao_Paulo
    ports:
      - "8500:8500"
    labels:
        # Traefik Config
      - "traefik.enable=true"
      - "traefik.http.routers.idr-api.rule=Host(`idr-api.app.pb.utfpr.edu.br`)"
      - "traefik.http.routers.idr-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.idr-api.entrypoints=websecure"
    restart: unless-stopped
    networks:
      - web
      - database

  ########################### MINIO OBJECT STORAGE
  minio:
    image: minio/minio
    container_name: idr-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - TZ=America/Sao_Paulo
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - idr-minio:/data
    restart: unless-stopped
    networks:
      - database

########################### NETWORKS
networks:
  web:
    name: web
    driver: bridge
    external: true
    attachable: true
  database:
    name: database
    driver: bridge
    external: false
    attachable: true

########################### VOLUMES
volumes:
  idr-minio:
